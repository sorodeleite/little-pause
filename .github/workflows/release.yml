name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LITTLE_PAUSE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing LITTLE_PAUSE_KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > app/little-pause-release.jks

      - name: Build signed APK
        env:
          LITTLE_PAUSE_KEYSTORE_PATH: little-pause-release.jks
          LITTLE_PAUSE_KEYSTORE_PASSWORD: ${{ secrets.LITTLE_PAUSE_KEYSTORE_PASSWORD }}
          LITTLE_PAUSE_KEY_ALIAS: ${{ secrets.LITTLE_PAUSE_KEY_ALIAS }}
          LITTLE_PAUSE_KEY_PASSWORD: ${{ secrets.LITTLE_PAUSE_KEY_PASSWORD }}
        run: |
          test -n "$LITTLE_PAUSE_KEYSTORE_PASSWORD"
          test -n "$LITTLE_PAUSE_KEY_ALIAS"
          test -n "$LITTLE_PAUSE_KEY_PASSWORD"
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk little-pause.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          files: little-pause.apk
          generate_release_notes: true
