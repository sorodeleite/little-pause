name: Android build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "CHANGELOG.md"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare the same signing key used by My Sleep Angel
        run: |
          mkdir -p signing
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/sorodeleite/sleep-my-angel/main/android/keystore/sleep-my-angel.jks \
            --output signing/little-pause.jks
          test -s signing/little-pause.jks

      - name: Build signed release APK
        run: |
          LITTLE_PAUSE_KEYSTORE_PATH="$GITHUB_WORKSPACE/signing/little-pause.jks" \
          LITTLE_PAUSE_KEYSTORE_PASSWORD="android" \
          LITTLE_PAUSE_KEY_ALIAS="androiddebugkey" \
          LITTLE_PAUSE_KEY_PASSWORD="android" \
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk little-pause.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs little-pause.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-pause-apk
          path: little-pause.apk
          if-no-files-found: error

      - name: Read the app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "already released"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the release notes from the changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.published == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v heading="## $VERSION" 'index($0, heading) == 1 { flag = 1; next } /^## / { flag = 0 } flag' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "atualização do little pause $VERSION ♡" > release-notes.md
          fi
          cat release-notes.md

      - name: Publish the signed update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" little-pause.apk \
            --title "little pause $VERSION" \
            --notes-file release-notes.md
