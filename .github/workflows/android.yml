name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare the same signing key used by My Sleep Angel
        run: |
          mkdir -p signing
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/sorodeleite/sleep-my-angel/main/android/keystore/sleep-my-angel.jks \
            --output signing/little-pause.jks
          test -s signing/little-pause.jks

      - name: Build signed release APK
        run: |
          LITTLE_PAUSE_KEYSTORE_PATH="$GITHUB_WORKSPACE/signing/little-pause.jks" \
          LITTLE_PAUSE_KEYSTORE_PASSWORD="android" \
          LITTLE_PAUSE_KEY_ALIAS="androiddebugkey" \
          LITTLE_PAUSE_KEY_PASSWORD="android" \
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk little-pause.apk

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs little-pause.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-pause-0.4.2
          path: little-pause.apk
          if-no-files-found: error

      - name: Publish signed update
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.4.2
          name: Little Pause 0.4.2
          body: |
            Atualização do Little Pause.

            Baixe little-pause.apk e instale pelo próprio aplicativo.
          files: little-pause.apk
          overwrite_files: true