name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk little-pause.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-pause-0.3.1
          path: little-pause.apk
          if-no-files-found: error

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.3.1
          name: Little Pause 0.3.1
          body: |
            Versão de teste do Little Pause.

            Baixe o arquivo little-pause.apk e instale manualmente no Android.
          files: little-pause.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
