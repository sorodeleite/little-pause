<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>little pause · calendário</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="emoji/apple-emoji.css">
<link rel="stylesheet" href="calendar.css">
<link rel="stylesheet" href="calendar-jorte.css">
</head>
<body>
<div id="planner-root"></div>
<div id="lp-boot-error" role="status" hidden>
  <strong>não consegui abrir o calendário</strong>
  <span id="lp-boot-error-detail">recarregue a tela e tente de novo ♡</span>
  <button type="button" onclick="location.reload()">abrir de novo ♡</button>
</div>
<script>
(function () {
  var box = document.getElementById('lp-boot-error');
  var detail = document.getElementById('lp-boot-error-detail');
  function show(message) {
    if (!box) return;
    if (detail && message) detail.textContent = message;
    box.hidden = false;
  }
  window.__littlePauseCalendarReady = function (count) {
    if (count > 0) { box.hidden = true; return; }
    show('o calendário abriu vazio. tenta recarregar ♡');
  };
  window.addEventListener('error', function (event) {
    show(event && event.message ? event.message : 'erro inesperado');
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event && event.reason;
    show(reason && reason.message ? reason.message : 'erro inesperado');
  });
  /* se nada apareceu depois de alguns segundos, não deixa a tela branca:
     mostra o recadinho com o botão de abrir de novo */
  window.setTimeout(function () {
    if (box && box.hidden && !document.querySelector('.cal-cell')) {
      show('o calendário demorou pra abrir. tenta abrir de novo ♡');
    }
  }, 5000);
})();
</script>
<script src="calendar-style.js"></script>
<script src="calendar-events.js"></script>
<script src="calendar-holidays.js"></script>
<script src="sticker-manifest.js"></script>
<script src="planner.js"></script>
</body>
</html>
